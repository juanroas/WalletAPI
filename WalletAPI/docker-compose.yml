version: '3.8'

services:
  webapi:
    image: walletapi
    container_name: wallet-api
    build:
      context: .
      dockerfile: Dockerfile
    networks: 
      - codenet
    ports:
      - "5077:8080"
    depends_on:
      - db
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
  db:
    image: postgres:15
    container_name: wallets.database
    restart: always
    ports:
      - "5432:5432"
    networks: 
      - codenet
    environment:
      - POSTGRES_DB=walletdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres 
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5 

networks:
    codenet:
       driver: bridge    
       
volumes:
  db-data:
